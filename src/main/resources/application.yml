spring:
  application:
    name: activation-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/activation_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:https://auth.exemplo.com/.well-known/jwks.json}

server:
  port: ${PORT:8080}
  shutdown: graceful

provider:
  url: ${PROVIDER_URL:http://localhost:8081}
  connect-timeout: 2s
  read-timeout: 3s
  max-attempts: 5
  initial-backoff: 2s
  backoff-multiplier: 2.0
  max-backoff: 60s
  batch-size: 20
  stuck-timeout: 5m

activation:
  processor:
    interval-ms: 2000
  reconciler:
    interval-ms: 60000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
