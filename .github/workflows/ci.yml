name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run builds and tests (including Testcontainers & ArchUnit)
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      - name: Build Docker image verification
        run: |
          docker build -t activation-service:test .
